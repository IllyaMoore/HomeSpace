name: Android release

# Tag pushes are deliberately in their own workflow: the CI workflow filters on
# `paths`, and a path filter on a tag push does not evaluate the way you would
# expect, so a release would silently never run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for the APK filename (e.g. v0.1.0)"
        required: false
        default: "manual"

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  release:
    name: Build and publish the release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      # Signing is optional so a fork without the secrets still gets an APK —
      # it just comes out unsigned and has to be signed before it will install.
      - name: Decode the signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HOMESPACE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::HOMESPACE_KEYSTORE_BASE64 is not set — building an unsigned APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/homespace.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        env:
          HOMESPACE_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/homespace.jks', runner.temp) || '' }}
          HOMESPACE_KEYSTORE_PASSWORD: ${{ secrets.HOMESPACE_KEYSTORE_PASSWORD }}
          HOMESPACE_KEY_ALIAS: ${{ secrets.HOMESPACE_KEY_ALIAS }}
          HOMESPACE_KEY_PASSWORD: ${{ secrets.HOMESPACE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect the APK
        id: collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          LABEL="${{ github.event.inputs.tag || github.ref_name }}"
          SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -z "$SRC" ]; then
            echo "::error::no release APK was produced"
            exit 1
          fi
          SUFFIX=""
          if [ "${{ steps.keystore.outputs.signed }}" != "true" ]; then SUFFIX="-unsigned"; fi
          cp "$SRC" "artifacts/homespace-${LABEL}${SUFFIX}.apk"
          ls -la artifacts

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: homespace-${{ github.event.inputs.tag || github.ref_name }}
          path: android/artifacts/*.apk
          if-no-files-found: error

      # Drafted rather than published: a release APK should be looked at before
      # it is handed to anyone.
      - name: Attach the APK to a draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/artifacts/*.apk
          draft: true
          generate_release_notes: true
