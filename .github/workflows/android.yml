name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  # Lets a maintainer produce an APK from any branch without pushing a commit.
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Unit tests, lint, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK; this only makes the licence
      # state and platform-tools explicit so a runner image change is a clear
      # failure rather than a confusing one.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK after the commit
        id: rename
        run: |
          mkdir -p artifacts
          SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/homespace-debug-${SHA}.apk"
          echo "name=homespace-debug-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.name }}
          path: android/artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      # Uploaded even when the steps above fail — a red build is exactly when
      # the reports are worth reading.
      - name: Upload test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
